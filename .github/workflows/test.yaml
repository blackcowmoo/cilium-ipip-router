name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cilium-ipip-router-${{ github.head_ref || github.ref }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --target x86_64-unknown-linux-gnu
      - name: Test
        run: cargo test --target x86_64-unknown-linux-gnu
      - name: Clippy
        run: cargo clippy --target x86_64-unknown-linux-gnu -- -D warnings

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker
        run: docker build .

  e2e-tests:
    runs-on: ubuntu-latest
    env:
      KUBECONFIG: /tmp/kubeconfig
      CILIUM_CLI_VERSION: v0.20.0
      CILIUM_VERSION: 1.18.13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run unit tests and build the coverage-instrumented router
        shell: bash
        run: |
          set -euo pipefail
          cargo llvm-cov clean --workspace

          # cargo-llvm-cov generates the sourced environment.
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo test --all-targets
          cargo build --bin router
          mkdir -p coverage
          cp target/debug/router coverage/router

      - name: Set up kind
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: cilium-router-test
          config: .github/config/kind-config.yaml

      - name: Configure kubeconfig
        run: kind get kubeconfig --name cilium-router-test > "$KUBECONFIG"

      - name: Verify the Kubernetes cluster
        run: |-
          echo "::group::Show the Nodes"
          kubectl get nodes -o yaml
          echo "::endgroup::"

          echo "::group::Show the Namespaces"
          kubectl get namespaces -o yaml
          echo "::endgroup::"

          echo "::group::Show the Pods in kube-system"
          kubectl get pods -o yaml -n kube-system
          echo "::endgroup::"

      - name: Install Cilium with native routing
        run: |
          curl --fail --location --remote-name-all \
            "https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-amd64.tar.gz"{,.sha256sum}
          sha256sum --check cilium-linux-amd64.tar.gz.sha256sum
          sudo tar xzf cilium-linux-amd64.tar.gz -C /usr/local/bin cilium
          MASTER_IP=$(kubectl get node cilium-router-test-control-plane -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')
          cilium install --version "$CILIUM_VERSION" \
            --set ipam.mode=kubernetes \
            --set routingMode=native \
            --set ipv4NativeRoutingCIDR=10.244.0.0/16 \
            --set autoDirectNodeRoutes=false \
            --set bpf.hostLegacyRouting=true \
            --set kubeProxyReplacement=true \
            --set hubble.enable=false \
            --set operator.enable=true \
            --set nodeSelector.kubernetes\\.io/os=linux \
            --set tolerations[0].key=node-role.kubernetes.io/control-plane \
            --set tolerations[0].effect=NoSchedule \
            --set tolerations[0].operator=Exists \
            --set tolerations[1].key=node.kubernetes.io/not-ready \
            --set tolerations[1].effect=NoSchedule \
            --set tolerations[1].operator=Exists \
            --set "k8sServiceHost=$MASTER_IP" \
            --set k8sServicePort=6443 \
            --wait=false

      - name: Verify the Cilium agents
        run: |-
          echo "::group::Show the Pods in kube-system"
          kubectl get pods -n kube-system -o yaml
          echo "::endgroup::"

          echo "::group::Show the ConfigMaps in kube-system"
          kubectl get configmaps -n kube-system -o yaml
          echo "::endgroup::"

      - name: Debug - Dump Cilium agent logs
        if: failure()
        run: |-
          echo "::group::Cilium agent logs"
          kubectl logs -n kube-system -l k8s-app=cilium --tail=200 || true
          echo "::endgroup::"

          echo "::group::Cilium agent pod describe"
          kubectl describe pods -n kube-system -l k8s-app=cilium || true
          echo "::endgroup::"

          echo "::group::Cilium agent container statuses"
          kubectl get pods -n kube-system -l k8s-app=cilium -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{range .status.containerStatuses[*]}{.name}={.state}{"\n"}{end}{end}' || true
          echo "::endgroup::"

          echo "::group::Node conditions summary"
          kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{range .status.conditions[*]}{.type}={.status}{"\t"}{.message}{"\n"}{end}{end}' || true
          echo "::endgroup::"

      - name: Wait for Cilium to be ready
        run: |
          cilium status --wait --wait-duration=5m

      - name: Build coverage-instrumented Docker image
        run: docker build -f Dockerfile.coverage -t cilium-ipip-router:test .

      - name: Load image into kind cluster
        run: kind load docker-image cilium-ipip-router:test --name cilium-router-test

      - name: Wait for nodes to be ready
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=120s || (
            echo 'Nodes not ready after timeout';
            kubectl get nodes -o yaml;
            kubectl get pods -n kube-system -o yaml;
            exit 1;
          )

      - name: Deploy controller
        run: |
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: cilium-ipip-router
            namespace: default
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: cilium-ipip-router
          rules:
            - apiGroups: [""]
              resources: ["nodes"]
              verbs: ["get", "watch", "list"]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: cilium-ipip-router
          subjects:
            - kind: ServiceAccount
              name: cilium-ipip-router
              namespace: default
          roleRef:
            kind: ClusterRole
            name: cilium-ipip-router
            apiGroup: rbac.authorization.k8s.io
          ---
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: cilium-ipip-router
            namespace: default
          spec:
            selector:
              matchLabels:
                app: cilium-ipip-router
            template:
              metadata:
                labels:
                  app: cilium-ipip-router
              spec:
                serviceAccountName: cilium-ipip-router
                hostNetwork: true
                dnsPolicy: ClusterFirstWithHostNet
                tolerations:
                  - key: node-role.kubernetes.io/control-plane
                    effect: NoSchedule
                containers:
                  - name: router
                    image: cilium-ipip-router:test
                    imagePullPolicy: Never
                    securityContext:
                      capabilities:
                        add: ["NET_ADMIN", "SYS_ADMIN"]
                      privileged: true
                    command:
                      - /usr/local/bin/router
                    env:
                      - name: NODE_NAME
                        valueFrom:
                          fieldRef:
                            fieldPath: spec.nodeName
                      - name: LLVM_PROFILE_FILE
                        value: /coverage/router-%p-%m.profraw
                    volumeMounts:
                      - name: coverage
                        mountPath: /coverage
                    readinessProbe:
                      httpGet:
                        path: /health
                        port: 9090
                      initialDelaySeconds: 5
                      periodSeconds: 5
                      timeoutSeconds: 3
                    livenessProbe:
                      httpGet:
                        path: /health
                        port: 9090
                      initialDelaySeconds: 15
                      periodSeconds: 10
                      timeoutSeconds: 5
                volumes:
                  - name: coverage
                    emptyDir: {}
          EOF

      - name: Wait for daemonset to be ready
        run: |
          set -x
          kubectl rollout status daemonset/cilium-ipip-router --timeout=120s || (
            echo 'failed rollout status';
            kubectl get pod -o yaml;
            kubectl get daemonset cilium-ipip-router -o yaml;
            (kubectl logs daemonset/cilium-ipip-router -p -c router || kubectl logs daemonset/cilium-ipip-router -c router);
            exit 1;
          )

      - name: Verify router pods are running
        run: |
          set -x
          kubectl wait --for=condition=ready pod -l app=cilium-ipip-router --namespace=default --timeout=120s || (
            echo 'No router pods found after rollout';
            kubectl get pods -l app=cilium-ipip-router -o wide;
            kubectl describe daemonset cilium-ipip-router;
            exit 1;
          )

      - name: Run Rust Kubernetes integration tests
        shell: bash
        run: |
          set -euo pipefail
          # cargo-llvm-cov generates the sourced environment.
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo test --test e2e_integration_tests -- --ignored --test-threads=1

      - name: Run E2E shell tests
        run: |
          chmod +x tests/e2e/*.sh
          bash tests/e2e/run.sh cilium-router-test

      - name: Collect router coverage profiles
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pods < <(kubectl get pods -n default -l app=cilium-ipip-router \
            --field-selector=status.phase=Running \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
          if [ "${#pods[@]}" -eq 0 ]; then
            echo "No router pods found for coverage collection" >&2
            exit 1
          fi

          mkdir -p target
          collected=0
          for pod in "${pods[@]}"; do
            initial_restarts=$(kubectl get pod "$pod" -n default \
              -o jsonpath='{.status.containerStatuses[?(@.name=="router")].restartCount}')

            # LLVM writes the raw profile when the instrumented process exits.
            kubectl exec "$pod" -n default -c router -- sh -c 'kill -TERM 1'

            restarted=false
            for _ in $(seq 1 60); do
              current_restarts=$(kubectl get pod "$pod" -n default \
                -o jsonpath='{.status.containerStatuses[?(@.name=="router")].restartCount}')
              if [ "${current_restarts:-0}" -gt "${initial_restarts:-0}" ]; then
                restarted=true
                break
              fi
              sleep 1
            done
            if [ "$restarted" != true ]; then
              echo "Router container in $pod did not restart after profile flush" >&2
              exit 1
            fi

            profile_files=""
            for _ in $(seq 1 30); do
              # The shell expression expands inside the pod.
              # shellcheck disable=SC2016
              profile_files=$(kubectl exec "$pod" -n default -c router -- sh -c \
                'for file in /coverage/*.profraw; do [ -f "$file" ] && printf "%s\n" "$file"; done' \
                2>/dev/null || true)
              [ -n "$profile_files" ] && break
              sleep 1
            done
            if [ -z "$profile_files" ]; then
              echo "No router coverage profile was produced in $pod" >&2
              exit 1
            fi

            profile_index=0
            while IFS= read -r remote_profile; do
              [ -z "$remote_profile" ] && continue
              local_profile="target/e2e-${pod}-${profile_index}.profraw"
              kubectl exec "$pod" -n default -c router -- cat "$remote_profile" > "$local_profile"
              if [ ! -s "$local_profile" ]; then
                echo "Collected an empty coverage profile from $pod" >&2
                exit 1
              fi
              profile_index=$((profile_index + 1))
              collected=$((collected + 1))
            done <<< "$profile_files"
          done

          echo "Collected $collected router coverage profiles from ${#pods[@]} pods"

      - name: Generate combined unit and E2E coverage
        shell: bash
        run: |
          set -euo pipefail
          # cargo-llvm-cov generates the sourced environment.
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          mkdir -p coverage
          cargo llvm-cov report --lcov --output-path coverage/lcov.info

      - name: Upload combined coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info

      - name: Collect logs on failure
        if: failure()
        run: |
          kubectl logs daemonset/cilium-ipip-router
          kind export logs --name cilium-router-test ./kind-logs || true

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name cilium-router-test
